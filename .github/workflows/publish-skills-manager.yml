name: Publish skills-manager formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published skills-manager release tag"
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-skills-manager-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.TAP_PR_TOKEN }}
      SOURCE_REPOSITORY: jboczek/skills-manager
    steps:
      - name: Check out trusted tap code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release and publish one formula PR
        run: ruby scripts/publish.rb
