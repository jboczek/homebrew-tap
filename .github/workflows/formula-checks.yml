name: Tap formula checks

on:
  pull_request:
    branches: [main]
    paths:
      - Formula/skills-manager.rb
      - scripts/publish.rb
      - scripts/publisher_contract.rb
      - .github/workflows/formula-checks.yml
      - .github/workflows/publish-skills-manager.yml
      - test/publisher_contract_test.rb
      - test/tap_workflow_contract_test.rb

permissions:
  contents: read

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            runner: macos-14
          - name: Intel
            runner: macos-15-intel
    name: formula (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tap PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run formula or automation checks
        run: |
          if [[ -f Formula/skills-manager.rb ]]; then
            if git show origin/main:Formula/skills-manager.rb >/dev/null 2>&1; then
              brew style --formula skills-manager
              brew audit --strict --online --os=all --arch=all --formula skills-manager
            else
              brew audit --new --formula skills-manager
            fi
            brew test-bot --only-formulae --build-from-source
            HOMEBREW_NO_INSTALL_FROM_API=1 brew install --build-from-source skills-manager
            brew test skills-manager
            skills-manager --version
          else
            ruby -I scripts test/publisher_contract_test.rb
            ruby test/tap_workflow_contract_test.rb
          fi
